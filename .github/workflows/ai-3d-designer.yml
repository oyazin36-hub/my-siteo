name: ai-3d-designer

on:
  push:
    branches: ["**"]
    paths:
      - "ai-3d-designer/**"
      - ".github/workflows/ai-3d-designer.yml"
  pull_request:
    paths:
      - "ai-3d-designer/**"
      - ".github/workflows/ai-3d-designer.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-3d-designer/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-3d-designer/server/requirements-dev.txt

      - name: OpenSCAD をインストール
        # 機構ルート(パラメトリック CAD)の実体。これが無いと
        # 寸法保証と内部空間の検証が丸ごと飛ばされる。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad

      - name: 依存をインストール
        run: pip install -r requirements-dev.txt

      - name: lint (ruff)
        run: ruff check .

      - name: format 確認 (ruff)
        run: ruff format --check .

      - name: テスト (pytest)
        run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-3d-designer/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: プラットフォーム定義を生成
        # android/ ios/ は生成物なのでリポジトリに含めていない。
        # 既存の lib/ と pubspec.yaml は --project-name 指定で上書きされない。
        run: flutter create . --project-name ai_3d_designer --platforms=android,ios

      - name: 依存を取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test
